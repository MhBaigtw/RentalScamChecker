# Fast checks on every commit. Type checks and tests run in CI (and via the commands in
# docs/testing.md) because they need the full dependency set and are slower.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: fix-byte-order-marker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/
  - repo: local
    hooks:
      - id: web-eslint
        name: eslint (apps/web)
        language: system
        entry: npm --prefix apps/web run -s lint
        files: ^apps/web/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
