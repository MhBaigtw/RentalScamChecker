[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rentalscamchecker"
version = "0.1.0"
description = "Rental listing risk checker: API and worker"
requires-python = ">=3.12,<3.13"
# Compatible-release pins (~=): patch/minor updates allowed, no major jumps.
dependencies = [
    "fastapi~=0.143.2",
    "uvicorn[standard]~=0.54.0",
    "sqlalchemy~=2.1.4",
    "psycopg[binary]~=3.3.6",
    "alembic~=1.20.0",
    "pydantic-settings~=2.16.0",
    "structlog~=26.1.0",
    "python-multipart~=0.0.32",
    "pillow~=12.3.0",
    "phonenumbers~=9.0.41",
    "httpx~=0.28.1",
    "anthropic~=1.15.0",
    "numpy~=2.5.4",
    "onnxruntime~=1.31.0",
    "imagehash~=4.3.2",
    "pgvector~=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.17.1",
    "mypy~=2.4.0",
    "pre-commit~=4.7.0",
]

[tool.setuptools.packages.find]
include = ["rentalscamchecker*"]

[tool.setuptools.package-data]
# Versioned scoring configs (M7, ED-027).
"rentalscamchecker.scoring" = ["*.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade, S: bandit subset
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.mypy]
# Strict on app code (CLAUDE.md). Tests are type-checked but not strictly.
python_version = "3.12"
strict = true
packages = ["rentalscamchecker"]

[[tool.mypy.overrides]]
# onnxruntime ships no type information.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (DATABASE_URL)",
]
