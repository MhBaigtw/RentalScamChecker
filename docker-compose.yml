# Local development database. Postgres 16 with the pgvector extension available.
# Host port 5434 because 5432/5433 are used by other projects on the dev machine.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rentalscamchecker}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 (TCP): the temporary server used during first-boot init listens only on the
      # Unix socket, so a socket check reports "ready" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
