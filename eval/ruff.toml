# Lint settings for the evaluation scripts: the API's settings, with three rules relaxed because
# these are standalone measurement tools, not app code. E501: long Markdown report lines.
# S101: asserts as sanity checks. S311: seeded random numbers for reproducible benchmarks.
extend = "../apps/api/pyproject.toml"

[lint.per-file-ignores]
"*.py" = ["E501", "S101", "S311"]
"fixtures/**/*.py" = ["E501"]

[lint.isort]
known-first-party = ["rentalscamchecker", "alembic"]
