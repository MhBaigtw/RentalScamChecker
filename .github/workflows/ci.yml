name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rsc
          POSTGRES_PASSWORD: rsc_ci_password
          POSTGRES_DB: rentalscamchecker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rsc -d rentalscamchecker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rsc:rsc_ci_password@localhost:5432/rentalscamchecker
      ENVIRONMENT: test
      CONTACT_HASH_PEPPER: ci-only-pepper-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Pretrained CLIP image encoder (int8 ONNX, 89 MB, MIT) for the photo tests; checksum-verified.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: var/models
          key: clip-model-${{ hashFiles('apps/api/rentalscamchecker/photos/model_files.py') }}
      - run: python -m rentalscamchecker.photos.model_files clip-vit-b32-int8
      - run: ruff check . ../../eval
      - run: ruff format --check . ../../eval
      - run: mypy
      - run: mypy tests alembic ../../eval
      - name: pgvector extension is available
        run: >-
          python -c "import sqlalchemy as sa, os;
          e = sa.create_engine(os.environ['DATABASE_URL']);
          c = e.connect();
          print(c.execute(sa.text(\"SELECT default_version FROM pg_available_extensions WHERE name='vector'\")).scalar_one())"
      - run: alembic upgrade head
      # Fails if the models and the migrations have drifted apart.
      - run: alembic check
      - run: pytest -v

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (browser journey, Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rsc
          POSTGRES_PASSWORD: rsc_ci_password
          POSTGRES_DB: rentalscamchecker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rsc -d rentalscamchecker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # tests/e2e_database.py derives its own database (rentalscamchecker_e2e_test) from this.
      DATABASE_URL: postgresql+psycopg://rsc:rsc_ci_password@localhost:5432/rentalscamchecker
      ENVIRONMENT: test
      CONTACT_HASH_PEPPER: ci-only-pepper-not-a-secret-0123456789abcdef
      # No venv in CI: setup-python's interpreter has the API installed.
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: apps/api
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: var/models
          key: clip-model-${{ hashFiles('apps/api/rentalscamchecker/photos/model_files.py') }}
      - run: python -m rentalscamchecker.photos.model_files clip-vit-b32-int8
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - name: Keep the Playwright report when the journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
