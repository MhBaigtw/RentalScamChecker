name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rsc
          POSTGRES_PASSWORD: rsc_ci_password
          POSTGRES_DB: rentalscamchecker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rsc -d rentalscamchecker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rsc:rsc_ci_password@localhost:5432/rentalscamchecker
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: mypy tests alembic
      - name: pgvector extension is available
        run: >-
          python -c "import sqlalchemy as sa, os;
          e = sa.create_engine(os.environ['DATABASE_URL']);
          c = e.connect();
          print(c.execute(sa.text(\"SELECT default_version FROM pg_available_extensions WHERE name='vector'\")).scalar_one())"
      - run: alembic upgrade head
      - run: pytest -v

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
